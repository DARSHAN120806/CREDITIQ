services:
  - type: web
    name: creditiq-api
    runtime: python
    region: singapore
    rootDir: .
    buildCommand: pip install -r services/api/requirements-lock.txt && python deploy/prepare_render_assets.py
    startCommand: cd services/api && python -m scripts.start_server
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: creditiq-api-secrets
      - key: PORT
        value: "10000"
